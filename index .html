<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ARアシスタント（試作）</title>
<style>
  :root{
    --bg:#12130f; --panel:#1c1e18; --panel-2:#26281f;
    --line:#3a3d31; --text:#eae7d8; --muted:#a3a08c;
    --accent:#8fd14f;      /* 「押す」＝行動の色 */
    --mark:#f2a03d;        /* 枠・矢印のマーカー色 */
    --danger:#e2635a;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{max-width:560px;margin:0 auto;padding:16px;min-height:100vh}
  h1{font-size:18px;font-weight:600;margin:4px 0 2px;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}

  .field{margin-bottom:10px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .labelrow{display:flex;justify-content:space-between;align-items:baseline}
  .labelrow a{color:var(--accent);font-size:12px;text-decoration:none;font-weight:600}
  .labelrow a:active{opacity:.7}
  .remember{display:flex;align-items:center;gap:6px;margin-top:6px;
    color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
  .remember input{width:16px;height:16px;accent-color:var(--accent)}
  input[type=text],input[type=password]{width:100%;background:var(--panel);
    border:1px solid var(--line);color:var(--text);border-radius:var(--radius);
    padding:11px 12px;font-size:15px}
  input::placeholder{color:#6f6d5e}

  .stage{position:relative;background:#000;border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;aspect-ratio:3/4;margin:12px 0}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  canvas{display:none}
  .stage.frozen video{display:none}
  .stage.frozen canvas{display:block}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;text-align:center;padding:24px;pointer-events:none}

  .row{display:flex;gap:8px}
  button{flex:1;border:none;border-radius:var(--radius);padding:13px 14px;
    font-size:15px;font-weight:600;cursor:pointer;transition:filter .12s,opacity .12s}
  button:disabled{opacity:.45;cursor:not-allowed}
  .primary{background:var(--accent);color:#16240a}
  .ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line)}
  .primary:active,.ghost:active{filter:brightness(1.12)}

  .status{margin-top:12px;min-height:20px;font-size:14px;line-height:1.5}
  .status .ok{color:var(--accent)}
  .status .err{color:var(--danger)}
  .status .work{color:var(--mark)}
  .answer{margin-top:8px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px 14px;font-size:16px;display:none}
  .answer.show{display:block}
  .foot{margin-top:16px;color:#6f6d5e;font-size:11px;line-height:1.6}
  .foot code{color:var(--muted)}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--mark);
    border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <h1>ARアシスタント <span style="color:var(--muted);font-weight:400;font-size:13px">試作</span></h1>
  <p class="sub">カメラで機器を写して「やりたいこと」を入れると、押すボタンを枠と矢印で示し、音声で案内します。</p>

  <div class="field">
    <div class="labelrow">
      <label for="key">Gemini API キー</label>
      <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">キーを取得 ↗</a>
    </div>
    <input id="key" type="password" placeholder="AIza… （この端末内だけで保持）" autocomplete="off">
    <label class="remember"><input id="remember" type="checkbox" checked>このスマホに記憶する</label>
  </div>

  <div class="field">
    <label for="q">やりたいこと</label>
    <input id="q" type="text" placeholder="例：テレビの音量を上げたい" value="音量を上げたい">
  </div>

  <div class="row">
    <button id="camBtn" class="ghost">カメラを開始</button>
  </div>

  <div id="stage" class="stage">
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="hint" class="hint">「カメラを開始」を押してください</div>
  </div>

  <div class="row">
    <button id="shotBtn" class="primary" disabled>撮影して質問</button>
    <button id="retakeBtn" class="ghost" disabled>撮り直す</button>
  </div>

  <div id="status" class="status"></div>
  <div id="answer" class="answer"></div>

  <p class="foot">
    ※ 試作版のためAPIキーはこのブラウザ内だけで使われます（サーバー送信なし）。公開・配布時は
    <code>Firebase AI Logic</code> か中継サーバー経由に切り替えてください。<br>
    ※ モデルは <code>gemini-3.6-flash</code>。モデル名エラーが出たらコード内 <code>MODEL</code> を <code>gemini-flash-latest</code> に変更。
  </p>

<script>
const MODEL = "gemini-3.6-flash";
const $ = id => document.getElementById(id);
const stage=$("stage"), video=$("video"), canvas=$("canvas"), hint=$("hint");
const camBtn=$("camBtn"), shotBtn=$("shotBtn"), retakeBtn=$("retakeBtn");
const statusEl=$("status"), answerEl=$("answer");
let stream=null;

function setStatus(html, cls){ statusEl.innerHTML = cls?`<span class="${cls}">${html}</span>`:html; }

// APIキーの端末内保存（この端末でだけ有効。実サイトで動作、チャット内プレビューでは保存されない）
const keyInput=$("key"), remember=$("remember");
const KEY_STORE="ar_gemini_key";
try{ const saved=localStorage.getItem(KEY_STORE); if(saved){ keyInput.value=saved; remember.checked=true; } }catch(_){}
function persistKey(){
  try{
    if(remember.checked && keyInput.value.trim()) localStorage.setItem(KEY_STORE, keyInput.value.trim());
    else localStorage.removeItem(KEY_STORE);
  }catch(_){}
}
remember.addEventListener("change", persistKey);

camBtn.onclick = async () => {
  try{
    setStatus("カメラを起動中…","work");
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:"environment" }, width:{ideal:1280}, height:{ideal:960} },
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    hint.style.display="none";
    stage.classList.remove("frozen");
    shotBtn.disabled=false; retakeBtn.disabled=true;
    camBtn.textContent="カメラを再起動";
    setStatus("準備OK。機器を枠に収めて「撮影して質問」を押してください。","ok");
  }catch(e){
    setStatus("カメラを開けませんでした："+e.message+"（HTTPS または localhost で開いてください）","err");
  }
};

retakeBtn.onclick = () => {
  if(!stream) return;
  stage.classList.remove("frozen");
  answerEl.classList.remove("show");
  shotBtn.disabled=false; retakeBtn.disabled=true;
  setStatus("もう一度どうぞ。");
};

shotBtn.onclick = async () => {
  const key = $("key").value.trim();
  const question = $("q").value.trim();
  if(!key){ setStatus("APIキーを入力してください。","err"); return; }
  if(!question){ setStatus("やりたいことを入力してください。","err"); return; }
  if(!stream){ setStatus("先にカメラを開始してください。","err"); return; }
  persistKey();

  // 現フレームを固定
  const w = video.videoWidth, h = video.videoHeight;
  canvas.width=w; canvas.height=h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0,w,h);
  stage.classList.add("frozen");
  shotBtn.disabled=true; retakeBtn.disabled=false;

  // API送信用に縮小したJPEGを作る（トークン・遅延の節約。box_2dは正規化なので座標はズレない）
  const scale = Math.min(1, 1024/Math.max(w,h));
  const tmp = document.createElement("canvas");
  tmp.width=Math.round(w*scale); tmp.height=Math.round(h*scale);
  tmp.getContext("2d").drawImage(canvas,0,0,tmp.width,tmp.height);
  const b64 = tmp.toDataURL("image/jpeg",0.85).split(",")[1];

  setStatus('<span class="spin"></span>解析中…', "work");
  answerEl.classList.remove("show");

  try{
    const result = await askGemini(key, question, b64);
    if(!result.found){
      setStatus("該当するボタンが見つかりませんでした。もう少し寄って撮ってみてください。","err");
      speak("該当するボタンが見つかりませんでした。");
      return;
    }
    drawOverlay(ctx, w, h, result);
    setStatus("案内を表示しました。","ok");
    answerEl.textContent = "▶ " + result.instruction;
    answerEl.classList.add("show");
    speak(result.instruction);
  }catch(e){
    setStatus("エラー："+e.message,"err");
  }
};

async function askGemini(key, question, b64){
  const prompt =
`あなたはAR操作アシスタントです。画像はユーザーが操作したい機器（テレビのリモコン等）です。
ユーザーの要望：「${question}」
この操作のために押すべき「単一のボタンまたは操作部」の位置を特定してください。
座標 box_2d は [ymin, xmin, ymax, xmax] の形式で、各値は画像に対して0〜1000に正規化してください。
label はそのボタンの短い日本語名称。instruction は「〜のボタンを押してください」という短い日本語の音声案内文。
arrow_from はそのボタンを指す矢印を画像のどの辺から出すか（top / bottom / left / right のいずれか）。
確実に該当するボタンが写っていなければ found を false にしてください。`;

  const body = {
    contents:[{ parts:[
      { text: prompt },
      { inline_data:{ mime_type:"image/jpeg", data:b64 } }
    ]}],
    generationConfig:{
      temperature:0,
      responseMimeType:"application/json",
      responseSchema:{
        type:"object",
        properties:{
          found:{type:"boolean"},
          box_2d:{type:"array", items:{type:"number"}},
          label:{type:"string"},
          instruction:{type:"string"},
          arrow_from:{type:"string", enum:["top","bottom","left","right"]}
        },
        required:["found"]
      }
    }
  };

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(key)}`;
  const res = await fetch(url,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
  if(!res.ok){
    let msg = res.status+" "+res.statusText;
    try{ const j=await res.json(); if(j.error&&j.error.message) msg=j.error.message; }catch(_){}
    throw new Error(msg);
  }
  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text).join("") || "";
  let obj;
  try{ obj = JSON.parse(text); }
  catch(_){ throw new Error("応答の解析に失敗しました。"); }
  return obj;
}

function drawOverlay(ctx, w, h, r){
  const [ymin,xmin,ymax,xmax] = r.box_2d;
  const x = xmin/1000*w, y = ymin/1000*h;
  const bw = (xmax-xmin)/1000*w, bh = (ymax-ymin)/1000*h;
  const mark = getComputedStyle(document.documentElement).getPropertyValue("--mark").trim() || "#f2a03d";
  const line = Math.max(3, w*0.006);

  // 半透明の暗幕で該当ボタンを目立たせる
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,0.35)";
  ctx.fillRect(0,0,w,h);
  ctx.clearRect(x,y,bw,bh);
  ctx.drawImage(canvas,x,y,bw,bh,x,y,bw,bh); // 該当部分だけ元の明るさに戻す
  ctx.restore();

  // 枠
  ctx.save();
  ctx.strokeStyle=mark; ctx.lineWidth=line;
  roundRect(ctx,x,y,bw,bh,Math.min(bw,bh)*0.15); ctx.stroke();

  // 矢印
  const cx=x+bw/2, cy=y+bh/2, gap=Math.max(bw,bh)*0.9+30;
  let fx=cx, fy=cy, tx=cx, ty=cy;
  switch(r.arrow_from){
    case "bottom": fy=Math.min(h-10,y+bh+gap); ty=y+bh; break;
    case "left":   fx=Math.max(10,x-gap);      tx=x;    break;
    case "right":  fx=Math.min(w-10,x+bw+gap); tx=x+bw; break;
    default:       fy=Math.max(10,y-gap);      ty=y;    break; // top
  }
  drawArrow(ctx, fx,fy, tx,ty, mark, line);
  ctx.restore();

  // ラベル
  const label = r.label || "ここ";
  ctx.font = `600 ${Math.round(h*0.03)}px sans-serif`;
  const padX=Math.round(w*0.02), th=Math.round(h*0.045);
  const tw = ctx.measureText(label).width + padX*2;
  let lx = x, ly = (y-th-6 > 4) ? y-th-6 : y+bh+6;
  lx = Math.max(4, Math.min(lx, w-tw-4));
  ctx.fillStyle=mark;
  roundRect(ctx,lx,ly,tw,th,8); ctx.fill();
  ctx.fillStyle="#16240a"; ctx.textBaseline="middle";
  ctx.fillText(label, lx+padX, ly+th/2);
}

function drawArrow(ctx, x1,y1, x2,y2, color, lw){
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const ang=Math.atan2(y2-y1,x2-x1), hl=lw*4;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hl*Math.cos(ang-Math.PI/6), y2-hl*Math.sin(ang-Math.PI/6));
  ctx.lineTo(x2-hl*Math.cos(ang+Math.PI/6), y2-hl*Math.sin(ang+Math.PI/6));
  ctx.closePath(); ctx.fill();
}

function roundRect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function speak(text){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang="ja-JP"; u.rate=1.0;
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
